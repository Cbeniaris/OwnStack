
# Gazell wireless link (nRF Connect SDK Gazell link layer and glue)
CONFIG_GZLL=y
CONFIG_GAZELL=y

# USB HID mouse. The board helper that starts a CDC ACM-only USB device at boot is
# turned off because main.c builds the USB device (CDC ACM console + HID).
CONFIG_USBD_HID_SUPPORT=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n